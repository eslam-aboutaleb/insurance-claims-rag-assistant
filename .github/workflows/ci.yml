name: Full Suite CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend complete pytest suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: omnicare
          POSTGRES_PASSWORD: omnicare_password
          POSTGRES_DB: omnicare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnicare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OMNICARE_TEST_DATABASE_URL: postgresql+asyncpg://omnicare:omnicare_password@127.0.0.1:5432/omnicare_test
      DATABASE_URL: postgresql+asyncpg://omnicare:omnicare_password@127.0.0.1:5432/omnicare_test
      JWT_SECRET_KEY: ci-only-not-a-real-secret-32chars-min
      ENVIRONMENT: test
      OPENAI_API_KEY: ""
      OMNICARE_EVAL_LIVE: ""
      OMNICARE_EVAL_PERSIST: "0"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Apply migrations
        run: alembic upgrade head
      - name: Run complete backend suite
        run: pytest tests/ -q -p no:randomly

  frontend:
    name: Frontend lint, types, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

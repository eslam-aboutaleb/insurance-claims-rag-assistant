name: Central CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: insurance-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  python:
    name: Backend Python quality
    uses: eslam-aboutaleb/ci-workflows/.github/workflows/python.yml@cb10612004f98e6ec10158af72c4d0e1a044e436
    with:
      project-dir: backend
      manager: pip
      python-versions: '["3.12"]'
      operating-systems: '["ubuntu-latest"]'
      test-path: ci_smoke
      ruff-version: '0.6.9'
      build-distribution: false

  integration:
    name: Backend PostgreSQL and Redis integration
    uses: eslam-aboutaleb/ci-workflows/.github/workflows/integration.yml@cb10612004f98e6ec10158af72c4d0e1a044e436
    with:
      project-dir: backend
      postgres-image: pgvector/pgvector:pg16
      redis-image: redis:7-alpine

  node:
    name: Frontend Node quality
    uses: eslam-aboutaleb/ci-workflows/.github/workflows/node.yml@cb10612004f98e6ec10158af72c4d0e1a044e436
    with:
      project-dir: frontend
      manager: npm
      node-versions: '["24"]'
      operating-systems: '["ubuntu-latest"]'
      test-shards: 1
      audit-level: high

  browser:
    name: Frontend Playwright
    uses: eslam-aboutaleb/ci-workflows/.github/workflows/browser.yml@cb10612004f98e6ec10158af72c4d0e1a044e436
    with:
      project-dir: frontend
      manager: npm
      node-version: '24'
      test-script: e2e:ci
      browsers: chromium
      shards: 1

  docker:
    name: Build all Dockerfiles
    strategy:
      fail-fast: false
      matrix:
        image:
          - dockerfile: backend/Dockerfile
            context: .
          - dockerfile: backend/Dockerfile.dev
            context: .
          - dockerfile: frontend/Dockerfile
            context: frontend
          - dockerfile: frontend/Dockerfile.dev
            context: frontend
    uses: eslam-aboutaleb/ci-workflows/.github/workflows/docker.yml@cb10612004f98e6ec10158af72c4d0e1a044e436
    with:
      dockerfile: ${{ matrix.image.dockerfile }}
      build-context: ${{ matrix.image.context }}
      platforms: linux/amd64

  security:
    name: Central security analysis
    uses: eslam-aboutaleb/ci-workflows/.github/workflows/security.yml@cb10612004f98e6ec10158af72c4d0e1a044e436
    permissions:
      contents: read
      actions: read
      security-events: write
      pull-requests: read
    with:
      languages: '["python", "javascript-typescript", "actions"]'
      dependency-severity: high

  workflow-validation:
    name: Central workflow syntax validation
    uses: eslam-aboutaleb/ci-workflows/.github/workflows/workflow-lint.yml@cb10612004f98e6ec10158af72c4d0e1a044e436

  commit-messages:
    permissions:
      contents: read
      pull-requests: read
    uses: eslam-aboutaleb/ci-workflows/.github/workflows/commit-messages.yml@cb10612004f98e6ec10158af72c4d0e1a044e436

  ci-success:
    name: CI Status Check
    if: always()
    needs: [python, integration, node, browser, docker, security, workflow-validation, commit-messages]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require every qualification workflow to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          jobs = json.loads(os.environ["JOB_RESULTS"])
          failures = {
              name: result["result"]
              for name, result in jobs.items()
              if result["result"] != "success"
          }
          if failures:
              for name, result in failures.items():
                  print(f"{name}: {result}")
              raise SystemExit("One or more required CI workflows did not pass.")
          print("Every required CI workflow passed.")
          PY

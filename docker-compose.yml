# ==============================================================================
# OmniCare Financial - Production Docker Compose Configuration
# ==============================================================================
# Services:
#   db       - PostgreSQL 16 database for claims, users, and conversations.
#   redis    - Shared cache for idempotent chat responses and rate-limit counters.
#   backend  - FastAPI backend with Google ADK agent and LiteLLM routing.
#   frontend - React/Vite frontend served with a static file server.
#
# Networking:
#   All services communicate via the default Docker bridge network.
#   The frontend accesses the backend through VITE_API_URL (http://localhost:8000).
#
# Volumes:
#   pg_data     - Persistent PostgreSQL data directory.
#   redis_data  - Durable snapshots of the Redis cache.
#
# Health Checks:
#   Each service defines a healthcheck to ensure dependencies are ready
#   before dependent services start. The frontend waits for the backend
#   health check, and the backend waits for the database health check.
# ==============================================================================

services:
  # ============================================================================
  # Database Service
  # ============================================================================
  # PostgreSQL 16 on Alpine Linux for minimal image size.
  # Stores all persistent data: users, claims, conversations, and policy chunks.
  db:
    image: pgvector/pgvector:pg16
    container_name: omnicare-db
    restart: unless-stopped
    environment:
      # Database credentials loaded from .env file with fallback defaults.
      # POSTGRES_PASSWORD is required and must be set in .env for production.
      POSTGRES_USER: ${POSTGRES_USER:-omnicare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      POSTGRES_DB: omnicare
    ports:
      # Published on a configurable host port, and bound to loopback only. The default is
      # 15432 rather than 5432 because a locally installed PostgreSQL -- or another
      # project's database container -- commonly occupies 5432, which makes Docker fail
      # with "Bind for 0.0.0.0:5432 failed: port is already allocated".
      # Binding to 127.0.0.1 keeps the database off every external interface; publishing
      # it on 0.0.0.0 would expose it to the whole local network.
      # The container always listens on 5432 internally, so services on the compose
      # network keep using db:5432 regardless of this value.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      # Persist database data across container restarts and recreations.
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      # Verify PostgreSQL is accepting connections before marking as healthy.
      test: ["CMD-SHELL", "pg_isready -U omnicare"]
      interval: 5s
      retries: 5

  # ============================================================================
  # Redis Service
  # ============================================================================
  # Shared state that cannot live in a single process: idempotent chat responses
  # (so a client retry lands on any replica and still replays instead of calling
  # the model again) and rate-limit counters (so the 20/minute chat budget is one
  # budget for the deployment, not one per replica).
  # Optional to run: every consumer falls back to in-process state when Redis is
  # absent, so the stack still works without this service.
  redis:
    image: redis:7-alpine
    container_name: omnicare-redis
    restart: unless-stopped
    ports:
      # Loopback only, same reasoning as the database above: an operator can
      # inspect the keyspace from the host without exposing it to the network.
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      # Persist database data across container restarts and recreations.
      - redis_data:/data
    command:
      # A snapshot once a minute when at least one key changed, so a restart
      # restores the replay cache instead of discarding it, and re-closes the
      # rate-limit windows it had open rather than silently granting a fresh
      # quota. The append-only file is off because everything stored here
      # expires, and rewriting that log is pure overhead.
      - redis-server
      - --save
      - "60"
      - "1"
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # Backend Service
  # ============================================================================
  # FastAPI backend with Google ADK agent, LiteLLM routing, pgvector RAG,
  # and PostgreSQL persistence. Policy ingestion runs automatically on startup.
  backend:
    build:
      # Build from the repository root (the Dockerfile
      # copies backend/pyproject.toml and backend sources).
      context: .
      dockerfile: backend/Dockerfile
    container_name: omnicare-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      # Load environment variables from the root .env file.
      # Required variables: OPENAI_API_KEY, DATABASE_URL, POSTGRES_PASSWORD.
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-omnicare}:${POSTGRES_PASSWORD}@db:5432/omnicare
      # Empty (the default) leaves every shared store in-process. Set
      # REDIS_URL in .env to make idempotency and rate limiting global.
      REDIS_URL: ${REDIS_URL:-}
    depends_on:
      # Wait for the database to be healthy before starting the backend.
      db:
        condition: service_healthy
      # The shared stores tolerate a Redis that is not up yet -- they fall back
      # to in-process behaviour and log why -- so this waits for a healthy Redis
      # but never blocks startup on it.
      redis:
        condition: service_healthy

    healthcheck:
      # Verify the backend health endpoint is responding.
      # The Python one-liner attempts to connect to /api/v1/health.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ============================================================================
  # Embedding Drain Worker
  # ============================================================================
  # Drains the `embedding_jobs` outbox: claims pending jobs, generates the
  # embedding, and upserts it into pgvector. Runs as its own process so embedding
  # latency and API failures never block a claim submission. Uses FOR UPDATE
  # SKIP LOCKED, so additional replicas scale without coordination.
  embedding-drain:
    build:
      # Same root context as the backend: the drainer imports ragit.
      context: .
      dockerfile: backend/Dockerfile
    container_name: omnicare-embedding-drain
    restart: unless-stopped
    command: ["python", "-m", "app.workers.embedding_drain"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-omnicare}:${POSTGRES_PASSWORD}@db:5432/omnicare
      EMBEDDING_DRAIN_INTERVAL_SECONDS: ${EMBEDDING_DRAIN_INTERVAL_SECONDS:-5}
      EMBEDDING_DRAIN_BATCH_SIZE: ${EMBEDDING_DRAIN_BATCH_SIZE:-10}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  # ============================================================================
  # Notification Drain Worker
  # ============================================================================
  # Drains the `notification_jobs` outbox: renders a claim notification and
  # materialises it in the recipient's in-app feed. Runs as its own process so
  # delivery latency and provider failures never block a claim transition -- the
  # API writes the job row in the claim transaction and this worker delivers it.
  # Uses FOR UPDATE SKIP LOCKED, so additional replicas scale without coordination,
  # and the feed's unique key on job_id keeps a redelivery from notifying twice.
  notification-drain:
    build:
      # Same root context as the backend: the drainer imports ragit.
      context: .
      dockerfile: backend/Dockerfile
    container_name: omnicare-notification-drain
    restart: unless-stopped
    command: ["python", "-m", "app.workers.notification_drain"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-omnicare}:${POSTGRES_PASSWORD}@db:5432/omnicare
      NOTIFICATION_DRAIN_INTERVAL_SECONDS: ${NOTIFICATION_DRAIN_INTERVAL_SECONDS:-5}
      NOTIFICATION_DRAIN_BATCH_SIZE: ${NOTIFICATION_DRAIN_BATCH_SIZE:-10}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  # ============================================================================
  # Frontend Service
  # ============================================================================
  # React/Vite frontend built as a static site and served with `serve`.
  # Communicates with the backend via the VITE_API_URL environment variable.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Inject the backend API URL at build time.
        # This is baked into the client bundle and cannot be changed at runtime.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: omnicare-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - HOST=0.0.0.0
      - VITE_API_URL=http://backend:8000
    depends_on:
      # Wait for the backend to be healthy before starting the frontend.
      # This ensures the frontend can reach the backend API on startup.
      backend:
        condition: service_healthy

# ==============================================================================
# Volumes
# ==============================================================================
# Named volumes ensure data persists across container lifecycle events.
# Driver is local (default), storing data on the host filesystem.

volumes:
  pg_data:
    name: omnicare_pg_data
    driver: local
  redis_data:
    name: omnicare_redis_data
    driver: local

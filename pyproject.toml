# uv workspace root.
#
# The workspace makes ``backend`` resolve its
# dependencies as a single project. The generic RAG
# machinery now comes from the published ``ragit``
# package (pinned git dependency, see
# backend/pyproject.toml). The frontend keeps its own
# tooling (package.json); this file only declares the
# Python workspace.

[tool.uv.workspace]
members = ["backend"]

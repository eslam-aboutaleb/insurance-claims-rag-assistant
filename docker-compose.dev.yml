# ==============================================================================
# OmniCare Financial - Development Docker Compose Configuration
# ==============================================================================
# Differences from production (docker-compose.yml):
#   - Uses development Dockerfiles (Dockerfile.dev) with hot-reloading.
#   - Mounts source code directories for live editing without rebuilds.
#   - Uses hardcoded database credentials for local development convenience.
#   - Anonymous volumes for node_modules and build caches to avoid conflicts.
#
# Hot Reloading:
#   Backend: Uvicorn --reload watches app/ and restarts on changes.
#   Frontend: Vite dev server (npm run dev) provides HMR via WebSocket.
#
# Volume Mounts:
#   Backend:  ./backend/app:/app/app - Live code reloading.
#   Frontend: ./frontend:/app         - Live code reloading.
#             /app/node_modules        - Anonymous volume to avoid host/container conflicts.
#             /app/.next               - Anonymous volume to persist Vite cache.
# ==============================================================================

services:
  # ============================================================================
  # Database Service
  # ============================================================================
  # Development database with hardcoded credentials for convenience.
  # Data persists in the pg_data_dev volume across restarts.
  db:
    image: pgvector/pgvector:pg16
    container_name: omnicare-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omnicare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omnicare_password}
      POSTGRES_DB: ${POSTGRES_DB:-omnicare}
    ports:
      # Bind to loopback only: the dev database must not be reachable
      # from the local network (matches the production compose file).
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnicare"]
      interval: 5s
      retries: 5

  # ============================================================================
  # Backend Service
  # ============================================================================
  # Development backend with hot-reloading enabled via Uvicorn --reload.
  # Source code is mounted as a volume so changes take effect immediately.
  backend:
    build:
      # Build from the repository root so the Dockerfile can copy
      # libs/ragkit (the backend depends on the local ragkit library).
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: omnicare-backend-dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount the app directory for live code reloading.
      # Changes to Python files trigger automatic Uvicorn restart.
       - ./backend/app:/app/app
       - ./backend/alembic.ini:/app/alembic.ini
       - ./backend/alembic:/app/alembic
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ============================================================================
  # Frontend Service
  # ============================================================================
  # Development frontend with Vite dev server and HMR.
  # Source code is mounted for live editing; node_modules is isolated in an
  # anonymous volume to prevent host/container dependency conflicts.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: omnicare-frontend-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - HOST=0.0.0.0
      - VITE_API_URL=http://localhost:8000
    volumes:
      # Mount the full frontend directory for live code reloading.
      - ./frontend:/app
      # Anonymous volume for node_modules to avoid conflicts between host
      # and container node_modules (different OS/architecture).
      - /app/node_modules
      # Anonymous volume for .next to persist Vite build cache and HMR state.
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy

# ==============================================================================
# Volumes
# ==============================================================================
# Named volumes for persistent data in development.
# Separate from production volumes to avoid data contamination.

volumes:
  pg_data_dev:
    name: omnicare_pg_data_dev
    driver: local

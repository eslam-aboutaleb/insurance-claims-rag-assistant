[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnicare-backend"
version = "1.0.0"
description = "OmniCare Financial Customer Assistant Backend"
requires-python = ">=3.11"
dependencies = [
    "PyJWT>=2.8.0",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic-settings==2.7.1",
    "python-dotenv==1.0.1",
    "google-adk>=1.2.0",
    "litellm>=1.84",
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "slowapi>=0.1.9",
    "argon2-cffi>=23.1.0",
    "sqlalchemy[asyncio]>=2.0.30,<2.1.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",
    "ragit[pgvector] @ git+https://github.com/eslam-aboutaleb/ragit.git@v0.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "tests*"]

[tool.uv]
dev-dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4", "UP", "SIM", "PL", "RET", "S", "ERA"]
ignore = [
    "S101",
    "PLR2004",
    "RET504",
    "B008",
    "PLR0912",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",
    "PLR2004",
    "E501",
    "PLC0415",
    "SIM105",
    "S110",
    "S105",
    "S108",
    "SIM117",
]
"app/agent/prompts.py" = [
    "E501",
]
"app/agent/agent.py" = [
    "PLW0603",
]
"alembic/versions/*.py" = [
    "E501",
]